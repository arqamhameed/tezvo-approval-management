<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024" role="img" aria-label="Tezvo Approval Management icon">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#6F5AA8"/>
      <stop offset="1" stop-color="#4E3D7C"/>
    </linearGradient>
    <linearGradient id="panel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.96"/>
      <stop offset="1" stop-color="#F5F3FA" stop-opacity="0.96"/>
    </linearGradient>
  </defs>

  <rect x="0" y="0" width="1024" height="1024" rx="220" fill="url(#bg)"/>

  <rect x="192" y="188" width="640" height="648" rx="88" fill="url(#panel)"/>
  <rect x="256" y="272" width="250" height="34" rx="17" fill="#D9D2EC"/>
  <rect x="256" y="328" width="190" height="26" rx="13" fill="#E6E1F2"/>

  <path d="M512 328 C 462 362, 398 368, 356 356 V 518 C 356 625, 430 713, 512 742 C 594 713, 668 625, 668 518 V 356 C 626 368, 562 362, 512 328 Z" fill="#6F5AA8"/>
  <path d="M452 520 l48 48 l92 -108" fill="none" stroke="#2ECC71" stroke-width="38" stroke-linecap="round" stroke-linejoin="round"/>

  <path d="M310 702 C 384 654, 454 638, 512 638 C 570 638, 640 654, 714 702" fill="none" stroke="#FFFFFF" stroke-opacity="0.9" stroke-width="18" stroke-linecap="round"/>
  <circle cx="310" cy="702" r="26" fill="#FFFFFF"/>
  <circle cx="512" cy="638" r="24" fill="#2ECC71"/>
  <circle cx="714" cy="702" r="26" fill="#FFFFFF"/>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <!-- Background -->
  <rect width="128" height="128" rx="18" fill="#1f6feb"/>

  <!-- Document body -->
  <rect x="30" y="22" width="58" height="72" rx="5" fill="#ffffff" opacity="0.15"/>
  <rect x="30" y="22" width="58" height="72" rx="5" fill="none" stroke="#ffffff" stroke-width="2.5"/>

  <!-- Document fold corner -->
  <polyline points="72,22 88,22 88,38" fill="#ffffff" opacity="0.3"/>
  <line x1="72" y1="22" x2="72" y2="38" stroke="#ffffff" stroke-width="1.5" opacity="0.5"/>
  <line x1="72" y1="38" x2="88" y2="38" stroke="#ffffff" stroke-width="1.5" opacity="0.5"/>

  <!-- Document lines -->
  <line x1="40" y1="50" x2="72" y2="50" stroke="#ffffff" stroke-width="2" stroke-linecap="round" opacity="0.7"/>
  <line x1="40" y1="60" x2="72" y2="60" stroke="#ffffff" stroke-width="2" stroke-linecap="round" opacity="0.7"/>
  <line x1="40" y1="70" x2="60" y2="70" stroke="#ffffff" stroke-width="2" stroke-linecap="round" opacity="0.7"/>

  <!-- Approval checkmark badge (overlapping bottom-right) -->
  <circle cx="88" cy="90" r="22" fill="#1f9d55"/>
  <circle cx="88" cy="90" r="22" fill="none" stroke="#ffffff" stroke-width="2.5"/>
  <polyline points="77,90 85,98 101,80" fill="none" stroke="#ffffff" stroke-width="4"
            stroke-linecap="round" stroke-linejoin="round"/>
</svg>
